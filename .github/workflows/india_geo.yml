name: Daily India Trending News & Geopolitics Shorts Pipeline

on:
  schedule:
    # 23:30 UTC = 5:00 AM IST - buffer before the 7:30 AM first slot, widened
    # from the 3-video schedule's buffer since 6 videos/day takes longer to render.
    - cron: '30 23 * * *'
  workflow_dispatch: {}

concurrency:
  group: news-to-video-pipeline-india
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg + fonts (Latin + Devanagari)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser openai edge-tts "moviepy==1.0.3" pillow numpy requests sarvam-ai \
              google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run India geopolitics pipeline
        env:
          NVIDIA_API_KEY_INDIA: ${{ secrets.NVIDIA_API_KEY_INDIA }}
          SARVAM_API_KEY_INDIA: ${{ secrets.SARVAM_API_KEY_INDIA }}
          PEXELS_API_KEY_INDIA: ${{ secrets.PEXELS_API_KEY_INDIA }}
          TELEGRAM_BOT_TOKEN_INDIA: ${{ secrets.TELEGRAM_BOT_TOKEN_INDIA }}
          TELEGRAM_CHAT_ID_INDIA: ${{ secrets.TELEGRAM_CHAT_ID_INDIA }}
          YOUTUBE_CLIENT_ID_INDIA: ${{ secrets.YOUTUBE_CLIENT_ID_INDIA }}
          YOUTUBE_CLIENT_SECRET_INDIA: ${{ secrets.YOUTUBE_CLIENT_SECRET_INDIA }}
          YOUTUBE_REFRESH_TOKEN_INDIA: ${{ secrets.YOUTUBE_REFRESH_TOKEN_INDIA }}
          AUTO_LOOP_INTERVAL_HOURS: "0"
        run: |
          python news_to_video_india.py

      - name: Upload rendered videos as a workflow artifact (7-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-shorts-india-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Persist pipeline state back to the repo
        if: always()
        run: |
          git config user.name "news-to-video-india-bot"
          git config user.email "actions@users.noreply.github.com"
          git add processed_news_india.txt queued_news_india.txt pending_youtube_uploads_india.txt decisions_log_india.jsonl 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git commit -m "chore: update India pipeline state [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No state changes to commit."
          fi
